<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TraceGuard · 工作台</title><style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-rows:auto 1fr;background:#f8faf9;color:#24362f;font:14px/1.6 'Segoe UI','Microsoft YaHei',sans-serif}header{padding:12px 24px;background:#fff;border-bottom:1px solid #e0e7e2}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}strong{font-size:18px;font-weight:650;margin-right:10px}button,a,.file,summary.menu-toggle{padding:7px 11px;border:1px solid #d9e2dc;border-radius:5px;background:#fff;color:#24362f;text-decoration:none;font:inherit;cursor:pointer}button:hover,a:hover,.file:hover,summary.menu-toggle:hover{background:#edf4ef}.file{position:relative;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}select{font:inherit;color:inherit;padding:7px;border:1px solid #d9e2dc;border-radius:5px;background:#fff}.primary{background:#216951;color:#fff;border-color:#216951}.primary:hover{background:#19533f}button:disabled,[aria-disabled=true]{opacity:.5;cursor:default}a[aria-disabled=true]{pointer-events:none}.export{display:flex;gap:8px;align-items:center;margin-left:auto}.menu{position:relative}.menu>summary{list-style:none}.menu>summary::-webkit-details-marker{display:none}.menu-panel{position:absolute;top:calc(100% + 7px);left:0;min-width:210px;z-index:5;background:#fff;border:1px solid #d9e2dc;border-radius:5px;padding:6px;box-shadow:0 8px 24px #24362f14}.menu-panel button{display:block;width:100%;text-align:left;border:0}.batch-state{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#586960;margin-top:8px}.batch-state p{margin:0}#pending{color:#846018}#pending.error,#status.error{color:#a84234}#status{font-size:12px;margin-left:auto}iframe{width:100%;height:100%;min-height:0;border:0}:focus-visible,.file:focus-within{outline:2px solid #216951;outline-offset:3px}::selection{background:#d5e9de}[hidden]{display:none!important}
@media(max-width:900px){.export{margin-left:0}.toolbar{gap:8px}.batch-state{display:block}.batch-state p+p{margin-top:4px}}@media(max-width:600px){header{padding:10px 16px}strong{width:100%;margin:0}.file{max-width:180px}.export{flex-wrap:wrap}#status{margin-left:0}.export a{font-size:13px}}

.report-bar{display:flex;gap:14px;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid #e0e7e2}.batch-state{margin:0;min-width:0;display:block}.batch-state p{overflow-wrap:anywhere}.batch-state p+p{margin-top:3px}.export{flex:none;gap:7px}.export a{font-size:13px;padding:5px 9px}.toolbar>.menu{margin-right:10px}#status{white-space:nowrap}.file{max-width:230px}
@media(max-width:1000px){.report-bar{align-items:flex-start;flex-direction:column;gap:8px}.export{margin-left:0;flex-wrap:wrap}.toolbar{gap:8px}}
@media(max-width:600px){.toolbar>.menu{margin-right:0}.file{max-width:190px}.report-bar{gap:8px}header{padding:10px 16px}.export a{padding:5px 8px}}

.model-settings{margin-top:12px;padding:14px 0 2px;border-top:1px solid #e0e7e2;max-height:48vh;overflow:auto}.model-settings h2{font-size:16px;margin:0 0 5px}.model-settings p{font-size:13px;color:#586960;margin:5px 0;max-width:100ch}.model-fields{display:grid;grid-template-columns:minmax(240px,1.5fr) minmax(160px,1fr) minmax(180px,1fr) 110px;gap:12px;margin:12px 0}.model-fields label{font-size:13px;display:grid;gap:5px;align-content:start}.model-fields input{width:100%;min-width:0;border:1px solid #d9e2dc;border-radius:5px;padding:7px 9px;font:inherit;color:inherit;background:#fff}.model-fields input::placeholder{color:#586960}.model-check{display:flex;align-items:center;gap:7px;font-size:14px}.model-check input{accent-color:#216951}.model-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}#model-notice{color:#846018}#model-status{font-size:13px;color:#216951}#model-status.error{color:#a84234}#model-status.pending{color:#846018}#next-mode{color:#216951}.model-key-help{font-size:12px;color:#586960}
@media(max-width:1000px){.model-fields{grid-template-columns:1fr 1fr}.model-settings{max-height:45vh}}
@media(max-width:600px){.model-fields{grid-template-columns:1fr;gap:10px}.model-settings{max-height:42vh}.model-settings p{font-size:12px}.model-check{align-items:flex-start}}
</style><header><div class="toolbar"><strong>票迹 <span style="font-weight:400">TraceGuard</span></strong><label class="file"><span id="file-name">选择操作记录</span><input id="file" type="file" accept=".jsonl,.ndjson,.txt" aria-label="选择本地轨迹JSONL"></label><select id="adapter" aria-label="Agent类型"><option value="invoice">开票机器人</option><option value="advisor">顾问机器人</option></select><button id="evaluate" class="primary" disabled>开始检查</button><button id="invoice-demo">看开票例子</button><details class="menu" id="examples"><summary class="menu-toggle">更多示例</summary><div class="menu-panel"><button id="demo">顾问开发示例</button></div></details><button id="model-toggle" aria-expanded="false" aria-controls="model-settings">模型接入（可选）</button><span id="status" role="status" aria-live="polite">加载中…</span></div><div class="report-bar"><div class="batch-state"><p id="current-batch">正在读取当前报告…</p><p id="current-mode"></p><p id="next-mode"></p><p id="pending" role="status" aria-live="polite" hidden></p></div><div class="export"><a href="/artifacts/submission.jsonl" id="download" download aria-disabled="true">下载比赛结果</a><a href="/artifacts/report.full.html" id="full-report" target="_blank" rel="noopener" aria-disabled="true">完整评测报告 ↗</a><a href="/regression" target="_blank" rel="noopener">保存的问题 ↗</a></div></div><section id="model-settings" class="model-settings" aria-labelledby="model-heading" hidden>
<h2 id="model-heading">模型接入（可选）</h2><p>不填写也能完成规则检查。支持 Chat Completions 风格接口，请使用服务商提供的地址、模型名称和Key。</p>
<div class="model-fields"><label>接口地址<input id="model-url" type="url" placeholder="https://模型服务地址/v1" autocomplete="off" spellcheck="false"></label><label>模型名称<input id="model-name" type="text" placeholder="服务商提供的模型名称" autocomplete="off" spellcheck="false"></label><label>API Key<input id="model-key" type="password" placeholder="填写Key" autocomplete="off" spellcheck="false"><span class="model-key-help" id="model-key-help">Key不会写入报告或提交包。</span></label><label>单次超时（秒）<input id="model-timeout" type="number" min="1" max="180" value="45"></label></div>
<label class="model-check"><input id="model-enabled" type="checkbox">下次开票检查启用AI辅助复核（顾问示例仍用规则检查）</label>
<p id="model-notice">启用后，任务内容、操作记录和规则结论会发送到所填模型服务。Key仅保存在当前程序内存，重启后清除。</p>
<div class="model-actions"><button id="model-save">保存设置</button><button id="model-test" disabled>测试连接</button><button id="model-clear">清除设置</button><span id="model-status" role="status" aria-live="polite">默认关闭，当前只用规则检查。</span></div>
<p>保存设置不会重新检查旧报告；连接测试仅发送测试内容。需要复核时，请重新选择文件并点击“开始检查”。模型意见不覆盖规则分数，接口失败时保留规则结果并标明失败。</p>
</section></header><iframe id="report" title="A/B版本评测报告" src="/artifacts/report.html?embed=1"></iframe>
<script>
const byId=id=>document.getElementById(id),file=byId('file'),button=byId('evaluate'),frame=byId('report');let current=null,busy=false,pending=false,modelDirty=false;let modelSettings={configured:false,enabled:false,test_status:"untested"};
function status(text,error=false){byId('status').textContent=text;byId('status').className=error?'error':'';}
function sync(){button.disabled=busy||!file.files.length;file.disabled=busy;byId('adapter').disabled=busy;for(const id of ['invoice-demo','demo'])byId(id).disabled=busy;for(const id of ['download','full-report']){const disabled=busy||!current?.ready;byId(id).setAttribute('aria-disabled',String(disabled));byId(id).tabIndex=disabled?-1:0;}byId('pending').hidden=!pending;for(const id of ['model-url','model-name','model-key','model-timeout','model-enabled','model-save','model-clear'])byId(id).disabled=busy;byId('model-test').disabled=busy||!modelSettings.configured||modelDirty;byId('next-mode').textContent='下次检查：'+(byId('adapter').value==='advisor'?'仅规则检查（顾问示例）':modelSettings.enabled?'规则＋模型辅助复核':'仅规则检查');}
function markPending(){pending=!!file.files.length;byId('pending').className='';byId('pending').textContent=pending?'已选择 '+file.files[0].name+'，尚未检查。当前报告未改变。':'';sync();}
async function readStatus({fillModel=false,syncAdapter=false}={}){const response=await fetch('/api/status');if(!response.ok)throw Error('无法读取报告状态');current=await response.json();byId('current-batch').textContent=current.ready?'当前报告：'+(current.source_name||'已有本地报告')+' · '+current.case_count+' 个任务'+(current.generated_at?' · '+current.generated_at.replace('T',' '):''):'尚无检查结果，请选择操作记录后开始检查。';if(current.adapter&&(fillModel||syncAdapter))byId('adapter').value=current.adapter;modelSettings=current.model_settings||{configured:false,enabled:false};const mode=current.evaluation_mode==='rules_with_model_advice',r=current.model_review_summary;byId('current-mode').textContent=current.ready?'当前报告模式：'+(mode?'规则＋模型辅助复核'+(r?'（成功 '+r.successful+'，失败 '+r.failed+'）':''):'仅规则检查'):'';if(fillModel)fillModelForm();sync();return current;}
async function check(path,payload,label){if(busy)return;if(modelDirty){modelMessage('模型设置尚未保存，请先保存或清除设置。','pending');byId('model-settings').hidden=false;byId('model-toggle').setAttribute('aria-expanded','true');return;}busy=true;sync();status(label+(modelSettings.enabled&&byId('adapter').value==='invoice'?'（正在逐条模型复核，可能需要数分钟）':''));if(pending)byId('pending').textContent='正在检查所选文件；下方仍显示上一批结果。';try{const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),result=await response.json();if(!response.ok)throw Error(result.error||'检查失败，请重新选择文件再试');pending=false;if(path!=='/api/evaluate'){file.value='';byId('file-name').textContent='选择操作记录';}frame.src='/artifacts/report.html?embed=1&t='+Date.now();await readStatus({syncAdapter:true});const review=result.model_review_summary;status('完成 · '+result.cases+' 个案例'+(review?.requested?' · 模型复核成功 '+review.successful+'，失败 '+review.failed:''),!!review?.failed);byId('examples').open=false;}catch(e){status(e.message,true);if(path==='/api/evaluate'&&file.files.length){pending=true;byId('pending').className='error';byId('pending').textContent='所选文件未完成检查；当前仍显示原有报告。';}}finally{busy=false;sync();}}
file.addEventListener('change',()=>{byId('file-name').textContent=file.files[0]?.name||'选择操作记录';markPending();});byId('adapter').addEventListener('change',()=>{markPending();if(pending)byId('pending').textContent+='将按“'+byId('adapter').selectedOptions[0].textContent+'”检查。';});
button.addEventListener('click',async()=>{if(!file.files.length||busy)return;if(file.files[0].size>32*1024*1024){status('文件超过32 MiB，请选择较小的JSONL文件。',true);return}const selected=file.files[0];await check('/api/evaluate',{jsonl:await selected.text(),file_name:selected.name,adapter:byId('adapter').value},'正在检查…');});
byId('invoice-demo').addEventListener('click',()=>check('/api/invoice-demo',{},'加载开票例子…'));byId('demo').addEventListener('click',()=>check('/api/demo',{},'加载顾问开发示例…'));
document.addEventListener('click',event=>{if(!byId('examples').contains(event.target))byId('examples').open=false;});document.addEventListener('keydown',event=>{if(event.key==='Escape')byId('examples').open=false;});
window.addEventListener('message',async event=>{if(event.source!==frame.contentWindow||event.origin!==location.origin||event.data?.type!=='traceguard:save-case')return;const caseId=event.data.case_id;try{if(busy)throw Error('请等待当前检查完成，再保存案例。');const response=await fetch('/api/regression/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case_id:caseId})}),result=await response.json();if(!response.ok)throw Error(result.error);frame.contentWindow.postMessage({type:'traceguard:save-result',case_id:caseId,ok:true,text:result.saved?'已保存此案例，可到“保存的问题”填写预期。':result.existing?'此案例已保存，可到“保存的问题”查看。':'此案例没有需要保存的问题。'},location.origin);}catch(e){frame.contentWindow.postMessage({type:'traceguard:save-result',case_id:caseId,ok:false,text:e.message},location.origin);}});

function modelMessage(text,kind=''){byId('model-status').textContent=text;byId('model-status').className=kind;}
function fillModelForm(){byId('model-url').value=modelSettings.base_url||'';byId('model-name').value=modelSettings.model||'';byId('model-key').value='';byId('model-timeout').value=modelSettings.timeout||45;byId('model-enabled').checked=!!modelSettings.enabled;byId('model-key').placeholder=modelSettings.configured?'Key已保存在本次运行中':'填写Key';byId('model-key-help').textContent=modelSettings.configured?'留空沿用已存Key；更换地址时须重填。':'Key不会写入报告或提交包。';modelDirty=false;}
byId('model-toggle').addEventListener('click',()=>{const panel=byId('model-settings');panel.hidden=!panel.hidden;byId('model-toggle').setAttribute('aria-expanded',String(!panel.hidden));});
for(const id of ['model-url','model-name','model-key','model-timeout','model-enabled'])byId(id).addEventListener('input',()=>{modelDirty=true;modelMessage('设置已修改，尚未保存；当前报告未改变。','pending');sync();});
async function modelAction(path,payload,label){if(busy)return;busy=true;sync();modelMessage(label);try{const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),result=await response.json();if(!response.ok)throw Error(result.error||'操作失败，请重试');modelSettings=result.model_settings;fillModelForm();await readStatus();modelMessage(path.endsWith('/test')?'连接成功，模型返回格式与证据校验通过。':path.endsWith('/clear')?'已清除Key和设置，下次只用规则检查。':'设置已保存，仅用于本次运行；当前报告未改变。');}catch(e){modelMessage(e.message,'error');await readStatus().catch(()=>{});}finally{busy=false;sync();}}
byId('model-save').addEventListener('click',()=>modelAction('/api/model/config',{base_url:byId('model-url').value,model:byId('model-name').value,api_key:byId('model-key').value,timeout:byId('model-timeout').value,enabled:byId('model-enabled').checked},'正在保存设置…'));
byId('model-test').addEventListener('click',()=>modelAction('/api/model/test',{},'正在测试连接（只发送连接测试内容）…'));
byId('model-clear').addEventListener('click',()=>modelAction('/api/model/clear',{},'正在清除Key和设置…'));

readStatus({fillModel:true}).then(state=>{status(state.ready?'就绪':'等待选择文件');if(!state.ready)frame.removeAttribute('src');}).catch(()=>{status('连接已断开，请重新启动工作台。',true);byId('current-batch').textContent='当前报告状态读取失败。';});
</script></html>
