<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TraceGuard · 保存的问题</title><style>
*{box-sizing:border-box}body{max-width:1080px;margin:32px auto;padding:0 24px;color:#24362f;background:#f8faf9;font:15px/1.7 'Segoe UI','Microsoft YaHei',sans-serif}h1{font-size:24px;margin:0}h2{font-size:19px;margin:0 0 8px}p{margin:8px 0 18px;color:#586960}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:20px 0}button,select,a{font:inherit;padding:7px 12px;border:1px solid #d9e2dc;border-radius:5px;background:#fff;color:inherit;text-decoration:none}button{cursor:pointer}button:hover,a:hover{background:#edf4ef}.primary{background:#216951;border-color:#216951;color:#fff}.primary:hover{background:#19533f}button:disabled,a[aria-disabled=true]{opacity:.5;cursor:default}a[aria-disabled=true]{pointer-events:none}.empty{padding:36px 0;border-block:1px solid #d9e2dc;margin:24px 0}.empty p{max-width:65ch}#status{min-height:24px;font-size:14px;color:#216951}#status.error{color:#a84234}.scroll{overflow:auto;margin:16px 0}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:12px;text-align:left;border-bottom:1px solid #d9e2dc;overflow-wrap:anywhere}th{font-weight:600;font-size:13px}td:first-child{font:12px Consolas,monospace}td select{max-width:100%}#cases{max-width:100%;margin-left:8px}#request{margin-top:12px}#review{margin:4px 0}small{font-size:13px;color:#586960}:focus-visible{outline:2px solid #216951;outline-offset:3px}::selection{background:#d5e9de}[hidden]{display:none!important}@media(max-width:600px){body{margin:20px auto;padding:0 16px}#cases{display:block;margin:8px 0;width:100%}th,td{padding:9px}table{min-width:560px}}
</style><h1>保存的问题</h1><p>核对并填写你期望的结果，再用同一案例检查后续版本。</p><div class="toolbar"><a href="/">返回工作台</a><button id="save">保存本批问题</button><button id="run" disabled>重新检查</button><a id="review-report" href="/artifacts/regression-report.html" target="_blank" aria-disabled="true" tabindex="-1">查看复查结果 ↗</a></div><p id="status" role="status" aria-live="polite">正在读取问题列表…</p><button id="retry" hidden>重新加载列表</button><section id="empty" class="empty" hidden><h2>还没有保存的问题</h2><p>保存本批发现的问题，填写预期结果后，可用于后续复查。也可以回到工作台，在某个案例旁点“保存此案例”。</p><button id="empty-save" class="primary">保存本批问题</button><p><small id="batch-hint"></small></p></section><section id="collection" hidden><label>选择案例<select id="cases" aria-label="选择已保存案例"></select></label><p id="request"></p><div class="scroll"><table><thead><tr><th>运行</th><th>这次应该办对吗</th><th id="outcome-heading">这次应该出票吗</th></tr></thead><tbody id="rows"></tbody></table></div><button id="review" class="primary" disabled>保存我期望的结果</button><p><small>预期由你核对后填写；程序以前给出的判断不会自动当作标准答案。只保存案例，还不能证明问题已经修复。</small></p></section><p><small>“保存本批问题”会收集当前整批有问题的案例，不只保存列表中选中的一项。</small></p>
<script>
const byId=id=>document.getElementById(id);let entries=[],busy=false,canSave=false,reportReady=false;
function text(tag,value){const n=document.createElement(tag);n.textContent=value;return n;}
function sync(){byId('save').disabled=busy||!canSave;byId('empty-save').disabled=busy||!canSave;byId('run').disabled=busy||!entries.length;byId('cases').disabled=busy;byId('review').disabled=busy||![...document.querySelectorAll('#rows select')].some(s=>s.value!=='');byId('review-report').setAttribute('aria-disabled',String(!reportReady||busy));byId('review-report').tabIndex=reportReady&&!busy?0:-1;}
async function api(path,payload){const r=await fetch(path,payload===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),v=await r.json();if(!r.ok)throw Error(v.error||'操作失败，请重试');return v;}
function show(){const e=entries.find(e=>e.record_id===byId('cases').value);byId('rows').replaceChildren();byId('request').textContent=e?.user_request||'';if(!e){sync();return}byId('outcome-heading').textContent=e.domain==='invoice'?'这次应该出票吗':'这次应该交付答复吗';for(const rid of e.run_ids){const tr=text('tr','');tr.append(text('td',rid));for(const key of ['agent_task_success',e.domain==='invoice'?'business_invoice_created':'business_artifact_created']){const td=text('td',''),select=text('select','');select.dataset.rid=rid;select.dataset.field=key;select.setAttribute('aria-label',rid+' '+(key==='agent_task_success'?'应该办对吗':'应该交付吗'));for(const [v,t] of [['','未指定'],['true',key==='agent_task_success'?'应该办对':'应该交付'],['false',key==='agent_task_success'?'应该识别出错误':'不应交付']]){const o=text('option',t);o.value=v;select.append(o);}const wanted=e.expected.runs?.[rid]?.[key];select.value=typeof wanted==='boolean'?String(wanted):'';select.addEventListener('change',sync);td.append(select);tr.append(td);}byId('rows').append(tr);}sync();}
async function refresh(){const [data,batch]=await Promise.all([api('/api/regression/list'),api('/api/status')]);entries=data.records;reportReady=data.report_ready===true;canSave=batch.ready&&batch.problem_count>0;byId('batch-hint').textContent=canSave?'当前报告有 '+batch.problem_count+' 个问题案例可保存。':batch.ready?'当前批次没有需要保存的问题。':'请先返回工作台，导入操作记录并完成检查。';byId('empty').hidden=entries.length>0;byId('collection').hidden=!entries.length;const chosen=byId('cases').value;byId('cases').replaceChildren();for(const e of entries){const o=text('option',e.case_id+' · '+(e.expected.reviewed?'已填写预期':'还没填写预期'));o.value=e.record_id;byId('cases').append(o);}if(entries.some(e=>e.record_id===chosen))byId('cases').value=chosen;byId('retry').hidden=true;show();}
async function action(fn){if(busy)return;busy=true;sync();byId('status').className='';try{await fn();}catch(e){byId('status').textContent=e.message;byId('status').className='error';}finally{busy=false;sync();}}
async function save(){const r=await api('/api/regression/save',{});await refresh();byId('status').textContent='本批问题：新增 '+r.saved+' 个，已保存 '+r.existing+' 个。请核对并填写预期。';}
byId('cases').onchange=show;byId('save').onclick=byId('empty-save').onclick=()=>action(save);
byId('run').onclick=()=>action(async()=>{const r=await api('/api/regression/run',{});reportReady=true;byId('status').textContent='符合预期 '+r.passed+'，不符合预期 '+r.failed+'，还没填写预期 '+r.unreviewed+'；与上次判断不同 '+r.snapshot_changed+'。';});
byId('review').onclick=()=>action(async()=>{const e=entries.find(e=>e.record_id===byId('cases').value);if(!e)throw Error('请先保存案例');const expected=structuredClone(e.expected);expected.reviewed=true;expected.runs=expected.runs||{};for(const s of document.querySelectorAll('#rows select')){const row=expected.runs[s.dataset.rid]||{};if(s.value==='')delete row[s.dataset.field];else row[s.dataset.field]=s.value==='true';if(Object.keys(row).length)expected.runs[s.dataset.rid]=row;else delete expected.runs[s.dataset.rid];}await api('/api/regression/review',{record_id:e.record_id,expected});await refresh();byId('status').textContent='已保存你指定的人工预期，可以重新检查。';});
byId('retry').onclick=()=>action(async()=>{await refresh();byId('status').textContent=entries.length?'已加载 '+entries.length+' 个案例。':'';});
refresh().then(()=>{byId('status').textContent=entries.length?'已加载 '+entries.length+' 个案例。':'';}).catch(e=>{byId('status').textContent='问题列表加载失败：'+e.message;byId('status').className='error';byId('retry').hidden=false;});
</script></html>
